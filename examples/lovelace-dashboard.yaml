# Janitza UMG 604-PRO dashboard voorbeeld voor Home Assistant
#
# Gebruik:
# 1. Maak in Home Assistant een nieuw dashboard of nieuwe view.
# 2. Kies "Raw configuration editor".
# 3. Plak deze YAML.
# 4. Dit voorbeeld is alvast ingevuld voor de meter UMG 604-PRO (192.168.1.30).
#
# Let op:
# Enkele entity IDs die niet in de aangeleverde lijst stonden zijn logisch aangevuld.
# Als een kaart "Entiteit niet gevonden" toont, zoek die sensor in Home Assistant op
# en vervang alleen die ene entity ID.

title: Janitza UMG 604-PRO
views:
  - title: Overzicht
    path: janitza-overzicht
    icon: mdi:meter-electric
    type: masonry
    badges: []
    cards:
      - type: markdown
        content: |
          # Janitza UMG 604-PRO
          Live Modbus TCP-overzicht van spanning, stroom, vermogen en energie.

      - type: grid
        title: Hoofdwaarden
        columns: 4
        square: false
        cards:
          - type: entity
            name: Frequentie
            icon: mdi:sine-wave
            entity: sensor.umg_604_pro_192_168_1_30_frequentie
          - type: entity
            name: Actief vermogen totaal
            icon: mdi:flash
            entity: sensor.umg_604_pro_192_168_1_30_vermogen_4
          - type: entity
            name: Power factor totaal
            icon: mdi:angle-acute
            entity: sensor.umg_604_pro_192_168_1_30_vermogensfactor
          - type: entity
            name: Temperatuur
            icon: mdi:thermometer
            entity: sensor.umg_604_pro_192_168_1_30_temperatuur

      - type: entities
        title: Spanningen fase-nul
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_spanning
            name: Spanning L1-N
            icon: mdi:alpha-l-circle
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_2
            name: Spanning L2-N
            icon: mdi:alpha-l-circle
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_3
            name: Spanning L3-N
            icon: mdi:alpha-l-circle

      - type: entities
        title: Spanningen lijn-lijn
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_4
            name: Spanning L1-L2
            icon: mdi:vector-line
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_5
            name: Spanning L2-L3
            icon: mdi:vector-line
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_6
            name: Spanning L3-L1
            icon: mdi:vector-line

      - type: entities
        title: Stromen
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_stroom
            name: Stroom L1
            icon: mdi:current-ac
          - entity: sensor.umg_604_pro_192_168_1_30_stroom_2
            name: Stroom L2
            icon: mdi:current-ac
          - entity: sensor.umg_604_pro_192_168_1_30_stroom_3
            name: Stroom L3
            icon: mdi:current-ac

      - type: entities
        title: Vermogen
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_vermogen
            name: Actief vermogen L1
          - entity: sensor.umg_604_pro_192_168_1_30_vermogen_2
            name: Actief vermogen L2
          - entity: sensor.umg_604_pro_192_168_1_30_vermogen_3
            name: Actief vermogen L3
          - type: divider
          - entity: sensor.umg_604_pro_192_168_1_30_vermogen_4
            name: Actief vermogen totaal
          - entity: sensor.umg_604_pro_192_168_1_30_reactief_vermogen
            name: Reactief vermogen totaal
          - entity: sensor.umg_604_pro_192_168_1_30_schijnbaar_vermogen
            name: Schijnbaar vermogen totaal

      - type: entities
        title: Energie
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_energie
            name: Afgenomen energie
          - entity: sensor.umg_604_pro_192_168_1_30_energie_2
            name: Teruggeleverde energie
          - entity: sensor.umg_604_pro_192_168_1_30_schijnbare_energie
            name: Schijnbare energie
          - entity: sensor.umg_604_pro_192_168_1_30_blindenergie
            name: Blindenergie
          - entity: sensor.umg_604_pro_192_168_1_30_blindenergie_inductive
            name: Inductieve blindenergie
          - entity: sensor.umg_604_pro_192_168_1_30_blindenergie_capacitive
            name: Capacitieve blindenergie

  - title: Grafieken
    path: janitza-grafieken
    icon: mdi:chart-line
    type: masonry
    badges: []
    cards:
      - type: history-graph
        title: Spanning fase-nul
        hours_to_show: 24
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_spanning
            name: L1-N
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_2
            name: L2-N
          - entity: sensor.umg_604_pro_192_168_1_30_spanning_3
            name: L3-N

      - type: history-graph
        title: Stroom per fase
        hours_to_show: 24
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_stroom
            name: L1
          - entity: sensor.umg_604_pro_192_168_1_30_stroom_2
            name: L2
          - entity: sensor.umg_604_pro_192_168_1_30_stroom_3
            name: L3

      - type: history-graph
        title: Vermogen
        hours_to_show: 24
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_vermogen_4
            name: Actief
          - entity: sensor.umg_604_pro_192_168_1_30_reactief_vermogen
            name: Reactief
          - entity: sensor.umg_604_pro_192_168_1_30_schijnbaar_vermogen
            name: Schijnbaar

      - type: history-graph
        title: Netkwaliteit
        hours_to_show: 24
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_frequentie
            name: Frequentie
          - entity: sensor.umg_604_pro_192_168_1_30_spanningsonbalans
            name: Spanningsonbalans
          - entity: sensor.umg_604_pro_192_168_1_30_stroomonbalans
            name: Stroomonbalans

  - title: Netkwaliteit
    path: janitza-netkwaliteit
    icon: mdi:chart-bell-curve
    type: masonry
    badges: []
    cards:
      - type: markdown
        content: |
          # Netkwaliteit
          Bewaking van frequentie, onbalans, THD/TDD, power factor en cosinus phi.

      - type: grid
        title: Kwaliteitsmeters
        columns: 3
        square: false
        cards:
          - type: gauge
            name: Spanningsonbalans
            entity: sensor.umg_604_pro_192_168_1_30_spanningsonbalans
            min: 0
            max: 5
            severity:
              green: 0
              yellow: 2
              red: 3
          - type: gauge
            name: Stroomonbalans
            entity: sensor.umg_604_pro_192_168_1_30_stroomonbalans
            min: 0
            max: 30
            severity:
              green: 0
              yellow: 10
              red: 20
          - type: gauge
            name: Power factor totaal
            entity: sensor.umg_604_pro_192_168_1_30_vermogensfactor
            min: 0
            max: 1
            severity:
              green: 0.95
              yellow: 0.8
              red: 0

      - type: entities
        title: Cosinus phi
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_cosinus_phi_l1
            name: Cosinus phi L1
          - entity: sensor.umg_604_pro_192_168_1_30_cosinus_phi_l2
            name: Cosinus phi L2
          - entity: sensor.umg_604_pro_192_168_1_30_cosinus_phi_l3
            name: Cosinus phi L3

      - type: entities
        title: Power factor
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_power_factor_l1
            name: Power factor L1
          - entity: sensor.umg_604_pro_192_168_1_30_power_factor_l2
            name: Power factor L2
          - entity: sensor.umg_604_pro_192_168_1_30_power_factor_l3
            name: Power factor L3
          - entity: sensor.umg_604_pro_192_168_1_30_gemiddelde_power_factor
            name: Gemiddelde power factor

      - type: entities
        title: THD spanning
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_thd_spanning_l1
            name: THD spanning L1
          - entity: sensor.umg_604_pro_192_168_1_30_thd_spanning_l2
            name: THD spanning L2
          - entity: sensor.umg_604_pro_192_168_1_30_thd_spanning_l3
            name: THD spanning L3

      - type: entities
        title: THD/TDD stroom
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_thd_stroom_l1
            name: THD stroom L1
          - entity: sensor.umg_604_pro_192_168_1_30_thd_stroom_l2
            name: THD stroom L2
          - entity: sensor.umg_604_pro_192_168_1_30_thd_stroom_l3
            name: THD stroom L3
          - type: divider
          - entity: sensor.umg_604_pro_192_168_1_30_tdd_stroom_l1
            name: TDD stroom L1
          - entity: sensor.umg_604_pro_192_168_1_30_tdd_stroom_l2
            name: TDD stroom L2
          - entity: sensor.umg_604_pro_192_168_1_30_tdd_stroom_l3
            name: TDD stroom L3

  - title: Apparaat
    path: janitza-apparaat
    icon: mdi:information-outline
    type: masonry
    badges: []
    cards:
      - type: entities
        title: Apparaatgegevens
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_apparaatnaam
            name: Apparaatnaam
          - entity: sensor.umg_604_pro_192_168_1_30_apparaatomschrijving
            name: Apparaatomschrijving
          - entity: sensor.umg_604_pro_192_168_1_30_serienummer
            name: Serienummer
          - entity: sensor.umg_604_pro_192_168_1_30_productienummer
            name: Productienummer
          - entity: sensor.umg_604_pro_192_168_1_30_firmware
            name: Firmware

      - type: entities
        title: Status en tellers
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_fasevolgorde
            name: Fasevolgorde
          - entity: sensor.umg_604_pro_192_168_1_30_digitale_ingang_1
            name: Digitale ingang 1
          - entity: sensor.umg_604_pro_192_168_1_30_digitale_ingang_2
            name: Digitale ingang 2
          - entity: sensor.umg_604_pro_192_168_1_30_gebeurtenisteller
            name: Gebeurtenisteller
          - entity: sensor.umg_604_pro_192_168_1_30_flagteller
            name: Flagteller
          - entity: sensor.umg_604_pro_192_168_1_30_transientteller
            name: TransiÃ«ntteller

      - type: entities
        title: Stroomtrafo-instellingen
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_stroomtrafo_primair_l1
            name: Primair L1
          - entity: sensor.umg_604_pro_192_168_1_30_stroomtrafo_primair_l2
            name: Primair L2
          - entity: sensor.umg_604_pro_192_168_1_30_stroomtrafo_primair_l3
            name: Primair L3
          - type: divider
          - entity: sensor.umg_604_pro_192_168_1_30_stroomtrafo_secundair_l1
            name: Secundair L1
          - entity: sensor.umg_604_pro_192_168_1_30_stroomtrafo_secundair_l2
            name: Secundair L2
          - entity: sensor.umg_604_pro_192_168_1_30_stroomtrafo_secundair_l3
            name: Secundair L3

      - type: entities
        title: Spanningstrafo-instellingen
        show_header_toggle: false
        entities:
          - entity: sensor.umg_604_pro_192_168_1_30_spanningstrafo_primair_l1
            name: Primair L1
          - entity: sensor.umg_604_pro_192_168_1_30_spanningstrafo_primair_l2
            name: Primair L2
          - entity: sensor.umg_604_pro_192_168_1_30_spanningstrafo_primair_l3
            name: Primair L3
          - type: divider
          - entity: sensor.umg_604_pro_192_168_1_30_spanningstrafo_secundair_l1
            name: Secundair L1
          - entity: sensor.umg_604_pro_192_168_1_30_spanningstrafo_secundair_l2
            name: Secundair L2
          - entity: sensor.umg_604_pro_192_168_1_30_spanningstrafo_secundair_l3
            name: Secundair L3

